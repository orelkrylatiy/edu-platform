services:
  workspace:
    build: .
    env_file: .env
    environment:
      WORKSPACE_DB: /app/data/workspace.sqlite3
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - workspace-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  workspace-data:
