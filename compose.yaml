services:
  workspace:
    build: .
    env_file: .env
    environment:
      WORKSPACE_DB: /app/data/workspace.sqlite3
      CONTENT_REPOSITORY: ${CONTENT_REPOSITORY-orelkrylatiy/edu-platform}
      CONTENT_BRANCH: ${CONTENT_BRANCH-content}
      CONTENT_SYNC_INTERVAL: ${CONTENT_SYNC_INTERVAL-3600}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - workspace-data:/app/data
      - ./content/private:/app/content/private:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  workspace-data:
